name: Live Health Check (6h)

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check 9 pages + /policy/ + critical assets
        run: |
          set -e
          URLS=(
            "https://ulsand.pages.dev/"
            "https://ulsand.pages.dev/story"
            "https://ulsand.pages.dev/atmosphere"
            "https://ulsand.pages.dev/first-visit"
            "https://ulsand.pages.dev/access"
            "https://ulsand.pages.dev/review"
            "https://ulsand.pages.dev/faq"
            "https://ulsand.pages.dev/contact"
            "https://ulsand.pages.dev/policy/"
            "https://ulsand.pages.dev/bulgwang-guide"
            "https://ulsand.pages.dev/sitemap.xml"
            "https://ulsand.pages.dev/robots.txt"
            "https://ulsand.pages.dev/llms.txt"
            "https://ulsand.pages.dev/site.webmanifest"
            "https://ulsand.pages.dev/sw.js"
            "https://ulsand.pages.dev/icon-192.png"
            "https://ulsand.pages.dev/icon-512.png"
            "https://ulsand.pages.dev/og/thumb-home.png"
          )
          FAIL=0
          for U in "${URLS[@]}"; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$U")
            if [ "$CODE" != "200" ]; then
              echo "[FAIL] $U → $CODE"
              FAIL=$((FAIL+1))
            else
              echo "[OK]   $U → 200"
            fi
          done

      - name: Live content guard — banned words must be 0
        run: |
          BANNED=("밤문화" "유흥" "2차로" "AggregateRating")
          FAIL=0
          for U in "https://ulsand.pages.dev/" \
                   "https://ulsand.pages.dev/story" \
                   "https://ulsand.pages.dev/atmosphere" \
                   "https://ulsand.pages.dev/first-visit" \
                   "https://ulsand.pages.dev/access" \
                   "https://ulsand.pages.dev/review" \
                   "https://ulsand.pages.dev/faq" \
                   "https://ulsand.pages.dev/contact" \
                   "https://ulsand.pages.dev/bulgwang-guide"; do
            BODY=$(curl -sL "$U")
            for W in "${BANNED[@]}"; do
              COUNT=$(echo "$BODY" | grep -c "$W" || true)
              if [ "$COUNT" != "0" ]; then
                echo "[FAIL] $U contains '$W' x$COUNT"
                FAIL=$((FAIL+1))
              fi
            done
          done
          if [ "$FAIL" != "0" ]; then
            echo "Total content-guard failures: $FAIL"
            exit 1
          fi
          echo "All live pages clean."
